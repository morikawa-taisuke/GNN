[project]
name = "gnn"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "librosa>=0.11.0",
    "matplotlib>=3.4.0",
    "numpy>=1.21.0",
    "pandas>=3.0.1",
    "pesq>=0.0.4",
    "pystoi>=0.4.1",
    "scipy>=1.17.1",
    "soundfile>=0.13.1",
    "tensorboard>=2.20.0",
    "torch>=2.5.1",
    "torch-geometric>=2.3.0",
    "torchaudio>=2.5.1",
    "torchinfo>=1.8.0",
    "torchmetrics>=1.9.0",
    "tqdm>=4.67.3",
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
